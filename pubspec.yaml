name: Rhythmic
description: "Music Player Application"
publish_to: 'none'
version: 1.0.4 +1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  youtube_explode_dart: ^2.2.2  
  just_audio: ^0.9.36    
  just_audio_windows: ^0.2.1       
  audio_session: ^0.1.16        
  http: ^1.2.0
  cupertino_icons: ^1.0.8
  just_audio_background: ^0.0.1-beta.17
